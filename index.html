<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>貓有方 Catwise｜釀釀老闆跑酷大作戰</title>
  <style>
    :root {
      --bg-cream: #FAF6EE;
      --bg-card: #FFFDF8;
      --warm-orange: #E8833A;
      --warm-orange-dark: #C96824;
      --soft-green: #4A7C59;
      --soft-green-light: #E4EFE7;
      --text-dark: #2E2925;
      --text-muted: #6E655E;
      --border-warm: #E6DAC8;
      --shadow-warm: rgba(74, 55, 40, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 16px;
      gap: 12px;
    }

    .app-shell {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-card);
      border: 2px solid var(--border-warm);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 4px 12px var(--shadow-warm);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      background: var(--soft-green);
      color: #FFFDF8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .game-title {
      margin: 0;
      font-size: clamp(15px, 2.6vw, 20px);
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.25;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      appearance: none;
      border: 2px solid var(--border-warm);
      background: var(--bg-cream);
      color: var(--text-dark);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-tool:hover:not(:disabled) {
      background: #F3EAD8;
      border-color: var(--warm-orange);
    }

    .btn-tool:active:not(:disabled) {
      transform: scale(0.96);
    }

    .btn-tool:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-tool.active-green {
      background: var(--soft-green-light);
      border-color: var(--soft-green);
      color: var(--soft-green);
    }

    /* Stage */
    .stage-wrapper {
      position: relative;
      width: 100%;
      background: var(--bg-card);
      border: 3px solid var(--border-warm);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow-warm);
      user-select: none;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      aspect-ratio: 800 / 360;
      background: #FAF6EE;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(250, 246, 238, 0.92);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      text-align: center;
      z-index: 10;
      overflow-y: auto;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-card {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border: 2px solid var(--border-warm);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 6px 18px var(--shadow-warm);
    }

    .overlay-heading {
      margin: 0 0 6px;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 800;
      color: var(--text-dark);
    }

    .quote-bubble {
      display: inline-block;
      background: #FFF3E4;
      border: 2px solid var(--warm-orange);
      color: #8A4010;
      font-size: clamp(12px, 2.2vw, 15px);
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .cast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .cast-item {
      background: var(--bg-cream);
      border: 1.5px solid var(--border-warm);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .cast-avatar {
      width: 44px;
      height: 44px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .cast-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .cast-role {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .controls-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 10px;
      line-height: 1.4;
    }

    .controls-hint kbd {
      background: #EFE6D5;
      border: 1px solid #D5C5AE;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .btn-primary {
      appearance: none;
      border: none;
      background: var(--warm-orange);
      color: #FFFDF8;
      font-size: 15px;
      font-weight: 800;
      padding: 10px 26px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--warm-orange-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }

    .btn-primary:hover {
      background: #F08D46;
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--warm-orange-dark);
    }

    /* Game Over Stats */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 10px;
    }

    .stat-pill {
      background: var(--bg-cream);
      border: 1.5px solid var(--border-warm);
      border-radius: 10px;
      padding: 6px 12px;
      min-width: 92px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .stat-pill.highlight {
      background: var(--soft-green-light);
      border-color: var(--soft-green);
    }

    .stat-pill.highlight .stat-value {
      color: var(--soft-green);
    }

    .new-record-badge {
      display: inline-block;
      background: var(--warm-orange);
      color: #FFFDF8;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .sidekick-note {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 10px;
    }

    /* Mobile / Touch Jump Bar */
    .touch-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-jump-pad {
      flex: 1;
      appearance: none;
      border: 2px solid var(--soft-green);
      background: var(--soft-green);
      color: #FFFDF8;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #34593F;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      touch-action: manipulation;
    }

    .btn-jump-pad:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #34593F;
    }

    .quick-tip {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Footer */
    .brand-footer {
      width: 100%;
      max-width: 880px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--soft-green);
      padding: 6px 10px;
      border-top: 1.5px dashed var(--border-warm);
    }

    /* Responsive adjustments for compact / mobile screens */
    @media (max-width: 600px) {
      body {
        padding: 8px 10px 12px;
        gap: 8px;
      }

      .top-bar {
        padding: 8px 10px;
      }

      .overlay {
        padding: 8px;
        justify-content: flex-start;
      }

      .overlay-card {
        padding: 10px 12px;
      }

      .cast-grid {
        gap: 5px;
        margin-bottom: 8px;
      }

      .cast-avatar {
        width: 32px;
        height: 32px;
      }

      .cast-role {
        display: none;
      }

      .quick-tip {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-title">
        <span class="brand-badge">貓有方 Catwise</span>
        <h1 class="game-title">釀釀老闆跑酷大作戰</h1>
      </div>
      <div class="toolbar-actions">
        <button id="btnSound" class="btn-tool active-green" type="button" aria-label="切換音效">
          <span id="soundIcon">🔊</span>
          <span id="soundLabel">音效開</span>
        </button>
        <button id="btnPause" class="btn-tool" type="button" disabled aria-label="暫停或繼續遊戲">
          <span id="pauseIcon">⏸</span>
          <span id="pauseLabel">暫停</span>
        </button>
      </div>
    </header>

    <main class="stage-wrapper">
      <div class="canvas-box">
        <canvas id="gameCanvas" width="800" height="360" aria-label="貓有方跑酷遊戲畫布"></canvas>

        <!-- Start Overlay -->
        <section id="startOverlay" class="overlay" aria-label="遊戲開始畫面">
          <div class="overlay-card">
            <h2 class="overlay-heading">《貓有方 Catwise｜釀釀老闆跑酷大作戰》</h2>
            <div class="quote-bubble">「本喵今天要巡視領地，鏟屎官跟上！」</div>

            <div class="cast-grid">
              <div class="cast-item">
                <canvas id="avatarNiang" class="cast-avatar" width="48" height="48"></canvas>
                <div class="cast-name">釀釀（主角）</div>
                <div class="cast-role">黑白賓士貓｜霸氣老闆</div>
              </div>
              <div class="cast-item">
                <canvas id="avatarHuang" class="cast-avatar" width="48" height="48"></canvas>
                <div class="cast-name">黃咬金</div>
                <div class="cast-role">虎斑貓｜吐槽副手</div>
              </div>
              <div class="cast-item">
                <canvas id="avatarDagen" class="cast-avatar" width="48" height="48"></canvas>
                <div class="cast-name">大根</div>
                <div class="cast-role">橘白貓｜元氣加油員</div>
              </div>
            </div>

            <p class="controls-hint">
              操作方式：按 <kbd>空白鍵</kbd> / <kbd>↑</kbd> 或 <strong>點擊螢幕</strong> 跳躍閃避障礙物、收集小魚乾 (+10分)
            </p>
            <button id="btnStart" class="btn-primary" type="button">開始巡視</button>
          </div>
        </section>

        <!-- Pause Overlay -->
        <section id="pauseOverlay" class="overlay hidden" aria-label="遊戲暫停畫面">
          <div class="overlay-card" style="max-width: 380px;">
            <h2 class="overlay-heading">巡視暫停中</h2>
            <div class="quote-bubble">「本喵先理一下毛，等會繼續！」</div>
            <div>
              <button id="btnResume" class="btn-primary" type="button">繼續巡視</button>
            </div>
          </div>
        </section>

        <!-- Game Over Overlay -->
        <section id="gameOverOverlay" class="overlay hidden" aria-label="遊戲結束畫面">
          <div class="overlay-card" style="max-width: 480px;">
            <h2 class="overlay-heading">巡視中斷！</h2>
            <div id="gameOverQuote" class="quote-bubble">「本喵很失望，今天罐罐扣一罐！」</div>

            <div class="stats-row">
              <div class="stat-pill">
                <div class="stat-label">本次分數</div>
                <div id="finalScore" class="stat-value">0</div>
              </div>
              <div class="stat-pill">
                <div class="stat-label">小魚乾</div>
                <div id="finalFish" class="stat-value">0</div>
              </div>
              <div class="stat-pill highlight">
                <div class="stat-label">
                  最高分<span id="newRecordBadge" class="new-record-badge hidden">NEW!</span>
                </div>
                <div id="finalBest" class="stat-value">0</div>
              </div>
            </div>

            <p id="sidekickNote" class="sidekick-note">黃咬金正在小本本上做記號…</p>
            <button id="btnRestart" class="btn-primary" type="button">再巡視一次</button>
          </div>
        </section>
      </div>
    </main>

    <div class="touch-controls">
      <button id="btnJumpPad" class="btn-jump-pad" type="button">🐾 點擊跳躍（空白鍵 / ↑）</button>
      <span class="quick-tip">P 鍵可暫停｜吃小魚乾 +10 分</span>
    </div>
  </div>

  <footer class="brand-footer">
    貓有方 Catwise｜養貓有方法，日子更安心
  </footer>

      function loadHighScore() {
        try {
          const val = window.localStorage.getItem(STORAGE_KEY);
          const parsed = parseInt(val, 10);
          return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
        } catch (e) {
          return 0;
        }
      }

      function saveHighScore(score) {
        try {
          window.localStorage.setItem(STORAGE_KEY, String(score));
        } catch (e) {
          // Ignore storage errors in restricted environments

      // ==========================================
      // 2. Web Audio Synthesizer (Retro 8-bit SFX)
      // ==========================================
      const SoundFX = {
        enabled: true,
        ctx: null,

        ensureContext() {
          if (!this.enabled) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },

        playTone(freq, duration, type, startTimeOffset, volume, slideTo) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime + (startTimeOffset || 0);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || 'square';
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
          }
          gain.gain.setValueAtTime(volume || 0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        },

        jump() {
          this.playTone(320, 0.13, 'square', 0, 0.07, 620);
        },

        fish() {
          this.playTone(660, 0.07, 'triangle', 0, 0.1);
          this.playTone(990, 0.12, 'triangle', 0.06, 0.1);
        },

        milestone() {
          this.playTone(523.25, 0.08, 'square', 0, 0.07);
          this.playTone(659.25, 0.08, 'square', 0.08, 0.07);
          this.playTone(783.99, 0.08, 'square', 0.16, 0.07);
          this.playTone(1046.5, 0.16, 'square', 0.24, 0.08);
        },

        hit() {
          this.playTone(220, 0.12, 'sawtooth', 0, 0.09, 95);
          this.playTone(130, 0.18, 'sawtooth', 0.09, 0.09, 60);

      function drawPixelSprite(ctx, matrix, palette, x, y, scale) {
        const px = Math.round(x);
        const py = Math.round(y);
        for (let r = 0; r < matrix.length; r++) {
          const row = matrix[r];
          for (let c = 0; c < row.length; c++) {
            const ch = row[c];
            if (ch === '.') continue;
            const color = palette[ch];
            if (!color) continue;
            ctx.fillStyle = color;
            ctx.fillRect(px + c * scale, py + r * scale, scale, scale);
          }
        }
      }

      function renderPortraitCanvas(canvasId, matrix) {
        const el = document.getElementById(canvasId);
        if (!el) return;
        const c = el.getContext('2d');
        c.imageSmoothingEnabled = false;
        c.clearRect(0, 0, el.width, el.height);
        drawPixelSprite(c, matrix, CAT_PALETTE, 0, 0, 4);
      }

      // ==========================================
      // 4. DOM Elements

      // ==========================================
      // 5. Game State
      // ==========================================
      const STATE = {
        START: 'start',

      };

        state: STATE.START,

        gameOverCooldown: 0,
        bgOffsetFar: 0,
        bgOffsetMid: 0,
        groundOffset: 0,

        obstacles: [],
        fishes: [],
        particles: [],
        floatingTexts: []
      };

      };

      // ==========================================
      // 6. Spawning & Physics
      // ==========================================
      function resetGame() {
        game.state = STATE.PLAYING;
        game.speed = game.baseSpeed;
        game.distanceScore = 0;
        game.fishScore = 0;
        game.fishCount = 0;
        game.totalScore = 0;
        game.nextMilestone = 200;
        game.milestoneTimer = 0;
        game.gameOverCooldown = 0;
        game.obstacles = [];
        game.fishes = [];
        game.particles = [];
        game.floatingTexts = [];
        game.spawnTimer = 0.85;

        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.isGrounded = true;
        player.animTimer = 0;
        player.animFrame = 0;
        player.jumpBuffer = 0;

        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        btnPause.disabled = false;
        pauseIcon.textContent = '⏸';
        pauseLabel.textContent = '暫停';
      }

      function triggerJump() {
        if (game.state === STATE.PLAYING) {
          if (player.isGrounded) {
            player.vy = player.jumpForce;
            player.isGrounded = false;
            player.jumpBuffer = 0;
            spawnDust(player.x + 20, GROUND_Y, 5);
            SoundFX.jump();
          } else {
            // Input buffer so tapping right before landing still jumps cleanly
            player.jumpBuffer = 0.12;
          }
        }
      }

      function spawnDust(x, y, count) {
        for (let i = 0; i < count; i++) {
          game.particles.push({
            x: x + (Math.random() * 16 - 8),
            y: y - 4,
            vx: -40 - Math.random() * 60,
            vy: -20 - Math.random() * 50,
            life: 0.35 + Math.random() * 0.2,
            maxLife: 0.5,
            size: 4,
            color: '#D4C3AD'
          });
        }
      }

      function spawnSparkles(x, y) {
        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8;
          game.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * (60 + Math.random() * 50),
            vy: Math.sin(angle) * (60 + Math.random() * 50),
            life: 0.45,
            maxLife: 0.45,
            size: 4,
            color: i % 2 === 0 ? '#FFD166' : '#E8833A'
          });
        }
      }

      function spawnObstacleAndFish() {
        const types = [
          { kind: 'vacuum', sprite: OBS_VACUUM, scale: 4, w: 56, h: 28 },
          { kind: 'clutter', sprite: OBS_CLUTTER, scale: 4, w: 48, h: 32 },
          { kind: 'toy', sprite: OBS_TOY, scale: 4, w: 48, h: 36 }
        ];
        const chosen = types[Math.floor(Math.random() * types.length)];
        const obsX = LOGICAL_W + 30;
        const obsY = GROUND_Y - chosen.h;

        game.obstacles.push({
          kind: chosen.kind,
          sprite: chosen.sprite,
          scale: chosen.scale,
          x: obsX,
          y: obsY,
          w: chosen.w,
          h: chosen.h
        });

        // Spawn fish snack either above the obstacle (rewarding jump) or in the safe mid-air gap
        if (Math.random() < 0.72) {
          const aboveObstacle = Math.random() < 0.55;
          const fishX = aboveObstacle ? obsX + 8 : obsX + chosen.w + 95;
          const fishY = aboveObstacle ? obsY - 58 : GROUND_Y - 78;
          game.fishes.push({
            x: fishX,
            y: fishY,
            w: 36,
            h: 21,
            bobPhase: Math.random() * Math.PI * 2,
            collected: false
          });
        }

        // Calculate guaranteed fair time until next obstacle based on current speed & jump air time
        // Jump air time is ~0.72s. Minimum safe gap distance = speed * 0.88 + 115
        const minSafeDist = game.speed * 0.88 + 115;
        const maxExtraDist = Math.min(260, game.speed * 0.55);
        const gapDist = minSafeDist + Math.random() * maxExtraDist;
        game.spawnTimer = gapDist / game.speed;
      }

      function handleGameOver() {
        game.state = STATE.GAMEOVER;
        game.gameOverCooldown = 0.35;
        SoundFX.hit();

        btnPause.disabled = true;
        const isNewRecord = game.totalScore > game.highScore;
        if (isNewRecord) {
          game.highScore = game.totalScore;
          saveHighScore(game.highScore);
        }

        const quote = GAME_OVER_QUOTES[Math.floor(Math.random() * GAME_OVER_QUOTES.length)];
        const sidekick = SIDEKICK_REACTIONS[Math.floor(Math.random() * SIDEKICK_REACTIONS.length)];

        gameOverQuoteEl.textContent = '「' + quote + '」';
        sidekickNoteEl.textContent = sidekick;
        finalScoreEl.textContent = String(game.totalScore);
        finalFishEl.textContent = String(game.fishCount);
        finalBestEl.textContent = String(game.highScore);
        newRecordBadgeEl.classList.toggle('hidden', !isNewRecord);

        gameOverOverlay.classList.remove('hidden');
      }

      function update(dt) {
        if (game.gameOverCooldown > 0) {
          game.gameOverCooldown = Math.max(0, game.gameOverCooldown - dt);
        }

        if (game.state !== STATE.PLAYING) return;

        // Speed scales smoothly with score
        game.speed = Math.min(game.maxSpeed, game.baseSpeed + game.totalScore * 0.28);

        // Parallax scrolling
        game.bgOffsetFar = (game.bgOffsetFar + game.speed * 0.16 * dt) % LOGICAL_W;
        game.bgOffsetMid = (game.bgOffsetMid + game.speed * 0.42 * dt) % LOGICAL_W;
        game.groundOffset = (game.groundOffset + game.speed * dt) % 64;

        // Score & milestones
        game.distanceScore += dt * 12;
        game.totalScore = Math.floor(game.distanceScore) + game.fishScore;

        if (game.totalScore >= game.nextMilestone) {
          game.milestoneTimer = 2.6;
          game.nextMilestone += game.nextMilestone < 1000 ? 300 : 500;
          SoundFX.milestone();
        }
        if (game.milestoneTimer > 0) {
          game.milestoneTimer = Math.max(0, game.milestoneTimer - dt);
        }

        // Player jump & gravity
        if (player.jumpBuffer > 0) {
          player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
        }

        player.vy += player.gravity * dt;
        player.y += player.vy * dt;

        if (player.y >= GROUND_Y - player.h) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          if (!player.isGrounded) {
            player.isGrounded = true;
            spawnDust(player.x + 22, GROUND_Y, 4);
            if (player.jumpBuffer > 0) {
              triggerJump();
            }
          }
        }

        // Running animation
        player.animTimer += dt * (game.speed / game.baseSpeed);
        if (player.animTimer >= 0.14) {
          player.animTimer = 0;
          player.animFrame = (player.animFrame + 1) % 2;
        }

        // Spawn obstacles
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          spawnObstacleAndFish();
        }

        // Fair hitbox for Niangniang (slightly inset from visual sprite)
        const pHit = {
          x: player.x + 14,
          y: player.y + 8,
          w: player.w - 26,
          h: player.h - 14
        };

        // Update obstacles & check collision
        for (let i = game.obstacles.length - 1; i >= 0; i--) {
          const obs = game.obstacles[i];
          obs.x -= game.speed * dt;

          const oHit = {
            x: obs.x + 6,
            y: obs.y + 4,
            w: obs.w - 12,
            h: obs.h - 6
          };

          if (
            pHit.x < oHit.x + oHit.w &&
            pHit.x + pHit.w > oHit.x &&
            pHit.y < oHit.y + oHit.h &&
            pHit.y + pHit.h > oHit.y
          ) {
            handleGameOver();
            return;
          }

          if (obs.x + obs.w < -40) {
            game.obstacles.splice(i, 1);
          }
        }

        // Update fish snacks & check collection
        for (let i = game.fishes.length - 1; i >= 0; i--) {
          const fish = game.fishes[i];
          fish.x -= game.speed * dt;
          fish.bobPhase += dt * 5;
          const fy = fish.y + Math.sin(fish.bobPhase) * 4;

          if (
            !fish.collected &&
            pHit.x < fish.x + fish.w &&
            pHit.x + pHit.w > fish.x &&
            pHit.y < fy + fish.h &&
            pHit.y + pHit.h > fy
          ) {
            fish.collected = true;
            game.fishCount += 1;
            game.fishScore += 10;
            game.totalScore = Math.floor(game.distanceScore) + game.fishScore;
            SoundFX.fish();
            spawnSparkles(fish.x + 18, fy + 10);
            game.floatingTexts.push({
              x: fish.x + 8,
              y: fy,
              text: '+10',
              life: 0.75
            });
            game.fishes.splice(i, 1);
            continue;
          }

          if (fish.x + fish.w < -40) {
            game.fishes.splice(i, 1);
          }
        }

        // Particles
        for (let i = game.particles.length - 1; i >= 0; i--) {
          const p = game.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) {
            game.particles.splice(i, 1);
          }
        }

        // Floating texts
        for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
          const ft = game.floatingTexts[i];
          ft.y -= 36 * dt;
          ft.life -= dt;
          if (ft.life <= 0) {
            game.floatingTexts.splice(i, 1);
          }
        }
      }

      // ==========================================
      // 7. Rendering (Cozy Pixel Living Room)

      function drawHUD() {
        // Score & High Score (Top Right)
        ctx.save();
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'right';

        const hiText = 'HI ' + String(game.highScore).padStart(5, '0');
        const scoreText = String(game.totalScore).padStart(5, '0');

        ctx.fillStyle = '#6E655E';
        ctx.fillText(hiText, LOGICAL_W - 110, 32);

        ctx.fillStyle = '#2E2925';
        ctx.fillText(scoreText, LOGICAL_W - 20, 32);

        // Fish count badge (Top Left)
        ctx.fillStyle = 'rgba(255, 253, 248, 0.88)';
        ctx.fillRect(16, 12, 118, 30);
        ctx.strokeStyle = '#E6DAC8';
        ctx.lineWidth = 2;
        ctx.strokeRect(16, 12, 118, 30);

        drawPixelSprite(ctx, FISH_SPRITE, FISH_PALETTE, 24, 19, 2);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#C96824';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('x ' + game.fishCount, 58, 32);

        // Milestone celebration banner with Dagen!
        if (game.milestoneTimer > 0) {
          const bannerW = 340;
          const bannerX = (LOGICAL_W - bannerW) / 2;
          ctx.fillStyle = '#FFF3E4';
          ctx.fillRect(bannerX, 54, bannerW, 44);
          ctx.strokeStyle = '#E8833A';
          ctx.lineWidth = 3;
          ctx.strokeRect(bannerX, 54, bannerW, 44);

          drawPixelSprite(ctx, PORTRAIT_DAGEN, CAT_PALETTE, bannerX + 10, 60, 3);
          ctx.fillStyle = '#8A4010';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('大根：' + game.milestoneText, bannerX + 54, 81);
        }

        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
        drawLivingRoomBackground();

        // Draw fish snacks
        for (let i = 0; i < game.fishes.length; i++) {
          const fish = game.fishes[i];
          const fy = fish.y + Math.sin(fish.bobPhase) * 4;
          drawPixelSprite(ctx, FISH_SPRITE, FISH_PALETTE, fish.x, fy, 3);
        }

        // Draw obstacles
        for (let i = 0; i < game.obstacles.length; i++) {
          const obs = game.obstacles[i];
          drawPixelSprite(ctx, obs.sprite, OBS_PALETTE, obs.x, obs.y, obs.scale);
          // Blinking green LED on robot vacuum
          if (obs.kind === 'vacuum' && Math.floor(Date.now() / 220) % 2 === 0) {
            ctx.fillStyle = '#70E000';
            ctx.fillRect(Math.round(obs.x + 24), Math.round(obs.y), 8, 4);
          }
        }

        // Draw Niangniang shadow on floor
        const heightAboveGround = Math.max(0, GROUND_Y - player.h - player.y);
        const shadowScale = Math.max(0.45, 1 - heightAboveGround / 160);
        ctx.fillStyle = 'rgba(74, 55, 40, 0.22)';
        ctx.fillRect(
          Math.round(player.x + 14 + (1 - shadowScale) * 16),
          GROUND_Y + 2,
          Math.round(38 * shadowScale),
          5
        );

        // Draw Niangniang
        let sprite = NIANG_RUN_1;
        if (game.state === STATE.GAMEOVER) {
          sprite = NIANG_HIT;
        } else if (!player.isGrounded) {
          sprite = NIANG_JUMP;
        } else if (player.animFrame === 1) {
          sprite = NIANG_RUN_2;
        }
        drawPixelSprite(ctx, sprite, CAT_PALETTE, player.x, player.y, 4);

        // Draw particles
        for (let i = 0; i < game.particles.length; i++) {
          const p = game.particles[i];
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // Draw floating +10 text
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'left';
        for (let i = 0; i < game.floatingTexts.length; i++) {
          const ft = game.floatingTexts[i];
          ctx.fillStyle = '#C96824';
          ctx.globalAlpha = Math.max(0, ft.life / 0.75);
          ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
        }
        ctx.globalAlpha = 1;

        drawHUD();
      }

      // ==========================================
      // 8. Main Loop & Controls
      // ==========================================
      let lastTime = 0;
      let rafId = null;

      function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const rawDt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        const dt = Math.min(rawDt, 0.05);

        update(dt);
        render();

        rafId = window.requestAnimationFrame(gameLoop);
      }

      function togglePause() {
        if (game.state === STATE.PLAYING) {
          game.state = STATE.PAUSED;
          pauseOverlay.classList.remove('hidden');
          pauseIcon.textContent = '▶';
          pauseLabel.textContent = '繼續';
        } else if (game.state === STATE.PAUSED) {
          game.state = STATE.PLAYING;
          pauseOverlay.classList.add('hidden');
          pauseIcon.textContent = '⏸';
          pauseLabel.textContent = '暫停';
          lastTime = performance.now();
        }
      }

      function toggleSound() {
        SoundFX.enabled = !SoundFX.enabled;
        if (SoundFX.enabled) {
          SoundFX.ensureContext();
          soundIcon.textContent = '🔊';
          soundLabel.textContent = '音效開';
          btnSound.classList.add('active-green');
        } else {
          soundIcon.textContent = '🔇';
          soundLabel.textContent = '靜音';
          btnSound.classList.remove('active-green');
        }
      }

      function handleActionInput(e) {
        if (e && e.cancelable) {
          e.preventDefault();
        }
        SoundFX.ensureContext();
        if (game.state === STATE.PLAYING) {
          triggerJump();
        }
      }

      // Keyboard controls
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
          e.preventDefault();
          SoundFX.ensureContext();
          if (game.state === STATE.START) {
            resetGame();
          } else if (game.state === STATE.PLAYING) {
            triggerJump();
          } else if (game.state === STATE.GAMEOVER && game.gameOverCooldown <= 0) {
            resetGame();
          }
        } else if (e.code === 'KeyP' || e.code === 'Escape') {
          if (game.state === STATE.PLAYING || game.state === STATE.PAUSED) {
            togglePause();
          }
        } else if (e.code === 'Enter') {
          if (game.state === STATE.START) {
            SoundFX.ensureContext();
            resetGame();
          } else if (game.state === STATE.GAMEOVER && game.gameOverCooldown <= 0) {
            SoundFX.ensureContext();
            resetGame();
          }
        }
      });

      // Canvas pointer/touch controls
      canvas.addEventListener('pointerdown', handleActionInput);
      btnJumpPad.addEventListener('pointerdown', handleActionInput);

      // UI Buttons
      btnStart.addEventListener('click', () => {
        SoundFX.ensureContext();
        resetGame();
      });
      btnRestart.addEventListener('click', () => {
        SoundFX.ensureContext();
        resetGame();
      });
      btnResume.addEventListener('click', togglePause);
      btnPause.addEventListener('click', togglePause);
      btnSound.addEventListener('click', toggleSound);

      // Auto-pause when tab loses visibility during active run
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && game.state === STATE.PLAYING) {
          togglePause();
        }
      });

      window.addEventListener('load', () => {
        renderPortraitCanvas('avatarNiang', PORTRAIT_NIANG);
        renderPortraitCanvas('avatarHuang', PORTRAIT_HUANG);
        renderPortraitCanvas('avatarDagen', PORTRAIT_DAGEN);

        if (rafId !== null) {
          window.cancelAnimationFrame(rafId);
        }
        lastTime = 0;
        rafId = window.requestAnimationFrame(gameLoop);
      });
    })();
  </script>
</body>
</html>
